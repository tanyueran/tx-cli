name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint / Type-check / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm type-check

      - name: 单元测试
        run: pnpm test

      - name: 构建产物
        run: pnpm build
